<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PredX · 事件合约交易终端</title>
<meta name="description" content="PredX —— 用价格表达你对未来的判断。事件合约、概率交易、实时盘口与结算，模拟盘演示。">
<meta name="theme-color" content="#080a0f">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b8cff'/%3E%3Cpath d='M9 21l5-7 4 4 5-8' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>

<header class="top">
  <a class="brand" href="#/markets">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 3.5L20 6"/></svg>
    </span>
    PredX <em>BETA</em>
  </a>
  <nav class="nav" id="nav">
    <a href="#/markets" data-nav="markets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7"
        height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7"
        height="7" rx="2"/></svg><span>市场</span></a>
    <a href="#/portfolio" data-nav="portfolio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round"><path d="m12 3 8 4.5-8 4.5L4 7.5 12 3Z"/><path d="m4 12 8 4.5 8-4.5"/></svg>
      <span>持仓</span></a>
    <a href="#/leaderboard" data-nav="leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v2a3 3 0 0 0 3 3M16 6h3v2a3 3 0 0 1-3 3"/>
        <path d="M12 12v5M9 20h6"/></svg><span>排行榜</span></a>
    <a href="#/admin" data-nav="admin" id="navAdmin" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round"><path d="M12 3.5 19 6v6c0 4-3 7-7 8.5C8 19 5 16 5 12V6l7-2.5Z"/></svg>
      <span>管理端</span></a>
  </nav>
  <div class="grow"></div>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="searchBox" type="search" placeholder="搜索事件（如 美联储、比特币）" autocomplete="off">
    <kbd>⌘K</kbd>
  </label>
  <div id="topRight" style="display:flex;align-items:center;gap:8px"></div>
</header>

<main id="app" class="main"><div class="wrap"><div class="sk sk-card" style="height:280px"></div></div></main>

<nav class="mobile-nav" id="mobileNav">
  <a href="#/markets" data-nav="markets">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7"
      height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7"
      height="7" rx="2"/></svg>市场</a>
  <a href="#/portfolio" data-nav="portfolio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round"><path d="m12 3 8 4.5-8 4.5L4 7.5 12 3Z"/><path d="m4 12 8 4.5 8-4.5"/></svg>持仓</a>
  <a href="#/leaderboard" data-nav="leaderboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M12 12v5M9 20h6"/></svg>排行</a>
  <a href="#/auth" data-nav="auth">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.6 3.8-5.2 7-5.2s5.8 1.6 7 5.2"/></svg>我的</a>
</nav>

<div id="toast"></div>
<div id="menuRoot"></div>
<div id="modalRoot"></div>

<script src="/app.js"></script>
</body>
</html>
