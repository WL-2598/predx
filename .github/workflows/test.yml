name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 确认运行时零依赖
        run: |
          python -V
          test ! -s requirements.txt && echo "requirements.txt 为空 —— 运行时无第三方依赖"

      - name: 安装测试工具（仅 pytest，非运行时依赖）
        run: python -m pip install --quiet pytest

      - name: 单元与接口测试
        run: python -m pytest tests -q

      - name: 初始化演示数据 + 系统级对账
        run: |
          python run.py --init-only
          python manage.py verify
          python manage.py stats

      - name: 冒烟测试（真实起服务 + curl）
        run: |
          python run.py --port 8101 &
          sleep 4
          make smoke PORT=8101
          kill %1 || true
